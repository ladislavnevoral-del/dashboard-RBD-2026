<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBD Dashboard 2026</title>
<style>
:root{
  --bg:#f4f3ef;--surface:#fff;--border:#e4e2da;--border2:#ccc9be;
  --text:#181715;--text2:#6a6860;--text3:#9a9890;
  --rev:#24581a;--rev-bg:#eaf4e6;--rev-brd:#b5dab0;
  --tech:#154b85;--tech-bg:#e5f0fb;--tech-brd:#a5c7f0;
  --green:#1a9e72;--green-bg:#e0f5ee;
  --amber:#b87215;--amber-bg:#faeeda;
  --red:#bf3828;--red-bg:#fdecea;
  --radius:9px
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}

/* LAYOUT */
.layout{display:flex;min-height:100vh}
.sidebar{width:224px;background:#1a1917;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#333 transparent}
.sb-brand{font-size:15px;font-weight:700;color:#fff;padding:15px 14px 12px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sb-brand span{color:#e05c4a}
.sb-nav{padding:8px 7px 0;flex-shrink:0}
.sb-lbl{font-size:9px;font-weight:700;color:rgba(255,255,255,.28);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 3px}
.sb-item{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.55);padding:7px 9px;border-radius:6px;cursor:pointer;transition:all .12s;margin-bottom:1px}
.sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.sb-ico{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.sb-div{height:1px;background:rgba(255,255,255,.07);margin:6px 7px}
.sb-team{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:8px 9px 2px}
.sb-team.r{color:rgba(100,190,80,.45)}
.sb-team.t{color:rgba(90,150,230,.45)}
.sb-person{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:6px;cursor:pointer;transition:all .12s;margin-bottom:1px}
.sb-person:hover{background:rgba(255,255,255,.07)}
.sb-person.active{background:rgba(255,255,255,.11)}
.sb-ph{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0}
.sb-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.sb-pname{font-size:11px;color:rgba(255,255,255,.58);overflow:hidden}
.sb-pname b{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.sb-pname small{font-size:9px;display:flex;gap:5px;margin-top:1px}
.sb-person:hover .sb-pname{color:rgba(255,255,255,.9)}
.sb-person.active .sb-pname{color:#fff}
.sb-person.active .sb-pname b{font-weight:700}

.main{flex:1;min-width:0;overflow-x:hidden}
.page{display:none;padding:20px;max-width:1440px}
.page.active{display:block}

/* CARDS & GRID */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.ctitle{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}

/* METRICS */
.met{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.met.g{border-left:3px solid var(--green)}.met.a{border-left:3px solid var(--amber)}
.met.r{border-left:3px solid var(--red)}.met.b{border-left:3px solid var(--tech)}.met.v{border-left:3px solid var(--rev)}
.mlbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.mval{font-size:22px;font-weight:700;line-height:1.1}
.msub{font-size:11px;color:var(--text2);margin-top:3px}

/* TABLES */
.tw{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f8f7f3;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
thead th.L{text-align:left}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafaf7}
tbody td{padding:7px 10px;text-align:right;vertical-align:middle}
tbody td.L{text-align:left}
tfoot td{padding:8px 10px;font-weight:700;background:#f5f3ee;border-top:2px solid var(--border2);text-align:right}
tfoot td.L{text-align:left}
.ghdr td{background:#f8f7f3;font-size:11px;font-weight:700;color:var(--text2);padding:5px 10px}

/* BADGES & TAGS */
.bdg{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.bdg-r{background:var(--rev-bg);color:var(--rev);border:1px solid var(--rev-brd)}
.bdg-t{background:var(--tech-bg);color:var(--tech);border:1px solid var(--tech-brd)}
.pot-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px}
.pot-H{background:#e0f5ee;color:#0a5c3f;border:1px solid #a5dcc5}
.pot-M{background:var(--amber-bg);color:#7a4a00;border:1px solid #eec870}
.pot-L{background:var(--red-bg);color:#8a1a14;border:1px solid #efb0ab}
.pot-N{background:#f2f1ed;color:var(--text2);border:1px solid var(--border2)}

/* PROGRESS */
.prog{display:flex;align-items:center;gap:6px}
.pbar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden;min-width:40px}
.pfill{height:100%;border-radius:3px}
.plbl{font-size:11px;font-weight:700;min-width:34px;text-align:right}

/* STAT ROWS */
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);font-size:12px}
.srow:last-child{border-bottom:none}

/* RECO BOXES */
.reco{border-radius:var(--radius);padding:10px 12px;margin-bottom:7px}
.reco-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.reco p{font-size:12px;line-height:1.55}
.rg{background:var(--green-bg);border:1px solid #a5dcc5}.rg .reco-title{color:#0a5c3f}
.ra{background:var(--amber-bg);border:1px solid #eec870}.ra .reco-title{color:#7a4a00}
.rr{background:var(--red-bg);border:1px solid #efb0ab}.rr .reco-title{color:#8a1a14}
.rb{background:var(--tech-bg);border:1px solid #9ac5ef}.rb .reco-title{color:#0f3d7a}

/* FORM ELEMENTS */
.btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:6px 14px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer}
.btn:hover{background:var(--bg)}
textarea{width:100%;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;resize:vertical;background:#fff;color:var(--text);line-height:1.5}
textarea:focus{outline:2px solid var(--tech);border-color:var(--tech)}
select{font-size:12px;padding:5px 8px;border-radius:6px;border:1px solid var(--border2);background:#fff;color:var(--text);cursor:pointer;width:100%}
input[type=number]{width:100%;border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:11px;text-align:right;background:#fff;color:var(--text)}
input[type=number].ro{background:#f8f7f3;color:var(--text3)}
input[type=text]{width:100%;border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:11px;background:#fff;color:var(--text)}
input:focus{outline:2px solid var(--tech);border-color:var(--tech)}

/* UTIL */
/* SPARKLINE */
.spark{display:flex;align-items:flex-end;gap:2px;height:28px}
.spark-bar{border-radius:1px 1px 0 0;min-width:6px;min-height:2px;transition:opacity .15s}
.spark-bar:hover{opacity:.7}
/* PROGRESS RING */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center}
/* ALERT BANNER */
.alert-banner{border-radius:var(--radius);padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:8px}
.alert-banner.ar{background:var(--red-bg);border:1px solid #efb0ab;color:#8a1a14}
.alert-banner.aa{background:var(--amber-bg);border:1px solid #eec870;color:#7a4a00}
.alert-banner.ag{background:var(--green-bg);border:1px solid #a5dcc5;color:#0a5c3f}
/* PRINT */
@media print{.sidebar{display:none}.main{margin-left:0}.page{display:block!important;page-break-after:always}}
.shdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stitle{font-size:17px;font-weight:700}
.ssub{font-size:12px;color:var(--text2);margin-top:2px}
hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.cg{color:var(--green);font-weight:700}.ca{color:var(--amber);font-weight:700}.cr{color:var(--red);font-weight:700}

/* DAYS BADGE */
.days-ok{color:var(--green);font-weight:700}
.days-warn{color:var(--amber);font-weight:700}
.days-bad{color:var(--red);font-weight:700}
.days-none{color:var(--text3)}

/* PERSON PHOTO */
.person-ph{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--border);flex-shrink:0}
.person-av{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>

    <div class="sb-brand">RBD <span>2026</span></div>

  <main class="main">
    <div id="page-overview" class="page active"></div>
    <div id="page-plan" class="page"></div>
    <div id="page-edit" class="page"></div>
  </main>
</div>

// Session storage for overrides
const NOTES = {}, POT_OVR = {};

// ── HELPERS ────────────────────────────────
const fm  = v => (!v||v===0)?'—':(v/1e6).toFixed(2).replace('.',',')+' M';
const fms = v => (!v||v===0)?'—':(v/1e6).toFixed(1).replace('.',',')+' M Kč';
const sodAll = p => MK.reduce((s,m)=>s+(p.sod[m]||0),0);
const sodQ1  = p => ['l','u','b'].reduce((s,m)=>s+(p.sod[m]||0),0);
const aktM   = (p,m) => (p.om[m]||0)+(p.vy[m]||0)+(p.op[m]||0)+(p.sc[m]||0);
const aktQ1  = p => ['l','u','b'].reduce((s,m)=>s+aktM(p,m),0);
const ratio  = (a,w) => w>0?(a/w).toFixed(2):'0';
const pcol   = pct => pct>=100?'var(--green)':pct>=60?'var(--amber)':'var(--red)';
const pcls   = pct => pct>=100?'cg':pct>=60?'ca':'cr';
const rcls   = r => parseFloat(r)>=1?'cg':parseFloat(r)>=0.5?'ca':'cr';
const daysCls= d => d<=14?'days-ok':d<=45?'days-warn':d>=999?'days-none':'days-bad';
const daysLbl= d => d>=999?'—':d+' d';

const getPot = p => POT_OVR[p.n]!==undefined ? POT_OVR[p.n] : p.pot;
const getNotes= p => NOTES[p.n]||'';
const potLbl = c => ({H:'Vysoký',M:'Střední',L:'Nízký',N:'Nováček'}[c]||'—');

function getPhoto(name, size) {
  const src = PHOTOS[name];
  if(src) return `<img src="${src}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;" alt="${name}">`;
  const p = PEOPLE.find(x=>x.n===name);
  const col=p?p.col:'#888', av=p?p.av:name.slice(0,2);
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${col}22;color:${col};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*.32)}px;font-weight:700;flex-shrink:0;">${av}</div>`;
}

function kpTier(p) {
  const m=p.kp/1e6;
  const t=p.tym==='tech'?[[120,2.5],[100,2],[80,1.5],[65,1],[50,.75],[40,.5],[30,.33]]:[[150,2.5],[125,2],[100,1.5],[85,1.5],[75,1],[62.5,.75],[50,.5],[35,.33]];
  for(const[th,pc] of t) if(m>=th) return pc;
  return 0;
}
function kpNext(p) {
  const m=p.kp/1e6;
  const t=p.tym==='tech'?[30,40,50,65,80,100,120]:[35,50,62.5,75,85,100,125,150];
  return t.find(x=>x>m)||null;
}

// ── NAVIGATION ─────────────────────────────
function nav(id) {
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  document.querySelectorAll('.sb-item,.sb-person').forEach(t=>t.classList.remove('active'));
  const pg=document.getElementById('page-'+id);
  if(pg) pg.classList.add('active');
  document.querySelectorAll(`[data-page="${id}"]`).forEach(t=>t.classList.add('active'));
  if(id==='overview') renderOverview();
  else if(id==='plan') renderPlan();
  else if(id==='edit') renderEdit();
}

function showPerson(name) {
  const p=PEOPLE.find(x=>x.n===name);
  if(!p) return;
  const pid='pp'+name.replace(/[^a-zA-Z0-9]/g,'_');
  let pg=document.getElementById(pid);
  if(!pg){pg=document.createElement('div');pg.id=pid;pg.className='page';document.querySelector('.main').appendChild(pg);}
  renderPerson(p,pg);
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.sb-item,.sb-person').forEach(t=>t.classList.remove('active'));
  pg.classList.add('active');
  document.querySelectorAll(`[data-page="${pid}"]`).forEach(t=>t.classList.add('active'));
  document.querySelector('.main').scrollTop=0;
}

// ── SIDEBAR ────────────────────────────────
function buildSidebar() {
  const el=document.getElementById('sbPeople');
  const teams=[
    {label:'Rev / Králík',cl:'r',ppl:PEOPLE.filter(p=>p.tym==='rev'&&p.vedouci==='Daniel Králík')},
    {label:'Rev / Holý',cl:'r',ppl:PEOPLE.filter(p=>p.tym==='rev'&&p.vedouci==='Jiří Holý')},
    {label:'Rev / Přikryl',cl:'r',ppl:PEOPLE.filter(p=>p.tym==='rev'&&p.vedouci==='Marek Přikryl')},
    {label:'Tech / Keclík',cl:'t',ppl:PEOPLE.filter(p=>p.tym==='tech'&&p.vedouci==='Jan Keclík')},
    {label:'Tech / Hanzal',cl:'t',ppl:PEOPLE.filter(p=>p.tym==='tech'&&p.vedouci==='Jan Hanzal')},
  ];
  let h='<div class="sb-div"></div>';
  teams.forEach(t=>{
    const tSod=t.ppl.reduce((s,p)=>s+sodAll(p),0);
    h+=`<div class="sb-team ${t.cl}">${t.label} <span style="font-size:9px;opacity:.5;font-weight:400">${tSod>0?'· '+fms(tSod):''}</span></div>`;
    t.ppl.forEach(p=>{
      const pid='pp'+p.n.replace(/[^a-zA-Z0-9]/g,'_');
      const src=PHOTOS[p.n];
      const img=src
        ?`<img src="${src}" class="sb-ph" alt="">`
        :`<div class="sb-av" style="background:${p.col}30;color:${p.col}">${p.av}</div>`;
      const sod=sodAll(p);
      const sodTxt=sod>0?`<span style="color:rgba(255,255,255,.38)">${fms(sod)}</span>`:'';
      const dc=p.pd;
      const dcCol=dc<=14?'#5ecfa8':dc<=45?'#f0c070':dc>=999?'rgba(255,255,255,.22)':'#e08080';
      const dcTxt=`<span style="color:${dcCol}">${dc>=999?'bez SoD':dc+'d'}</span>`;
      h+=`<div class="sb-person" data-page="${pid}" onclick="showPerson('${p.n.replace(/'/g,"\\'")}')">
        ${img}
        <div class="sb-pname"><b>${p.n}</b><small>${sodTxt}${sod>0?' ':''}${dcTxt}</small></div>
      </div>`;
    });
  });
  el.innerHTML=h;
}

// ── ALERT BANNERS ─────────────────────────────
function alertBanners() {
  const alerts = [];
  // No SoD > 60 days (experienced only)
  const stale = PEOPLE.filter(p=>p.pd>60&&p.pd<999&&!p.nastup.includes('2026')&&sodAll(p)>0);
  if(stale.length) alerts.push({t:'ar', msg:`${stale.length} obchodník${stale.length>1?'i':''} bez SoD přes 60 dní: ${stale.map(p=>p.n.split(' ')[1]).join(', ')}`});
  // Zero activity
  const noAkt = PEOPLE.filter(p=>aktQ1(p)===0&&!p.nastup.includes('2026')&&!p.nastup.includes('2025'));
  if(noAkt.length) alerts.push({t:'ar', msg:`Nulová aktivita Q1: ${noAkt.map(p=>p.n.split(' ')[1]).join(', ')}`});
  // Good news — big contracts this month
  const thisMonth = PEOPLE.filter(p=>p.pd<=7&&p.pd>0);
  if(thisMonth.length) alerts.push({t:'ag', msg:`Nové SoD tento týden: ${thisMonth.map(p=>p.n.split(' ')[1]+' '+fms(sodAll(p))).join(', ')}`});
  // Q2 plan warning
  const q2plan = PLANS.reduce((s,pl)=>s+pl.plan.d+pl.plan.k+pl.plan.c,0);
  const q1actual = PEOPLE.reduce((s,p)=>s+sodQ1(p),0);
  const q1plan = PLANS.reduce((s,pl)=>s+pl.plan.l+pl.plan.u+pl.plan.b,0);
  if(q1actual < q1plan*0.7) alerts.push({t:'aa', msg:`Q1 plnění pouze ${Math.round(q1actual/q1plan*100)}% — Q2 bude kritický. Plán Q2: ${fms(q2plan)}.`});
  if(!alerts.length) return '';

}

  const vals=['l','u','b','d'].map(m=>p.sod[m]||0);

  return `<div class="spark">${vals.map((v,i)=>`<div class="spark-bar" style="height:${Math.max(2,Math.round(v/mx*26))}px;background:${v>0?col:'var(--border)'};flex:1" title="${MNAMES[i]}: ${fms(v)}"></div>`).join('')}</div>`;
}

function rankBlock(tym,title,ps) {
  const sorted=[...ps].sort((a,b)=>sodAll(b)-sodAll(a));
  const max=Math.max(1,...sorted.map(p=>sodAll(p)));

          <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:6px">Potenciál Q2 2026</div>
          <select id="pot_${p.n.replace(/[^a-z]/gi,'_')}" onchange="savePot('${p.n.replace(/'/g,"\\'")}',this.value)">
            <option value="H" ${pot==='H'?'selected':''}>Vysoký — silný výkon očekáván</option>
            <option value="M" ${pot==='M'?'selected':''}>Střední — průměrný výsledek</option>
            <option value="L" ${pot==='L'?'selected':''}>Nízký — potřeba intervence</option>
            <option value="N" ${pot==='N'?'selected':''}>Nováček — bez hodnocení</option>
          </select>
          <div style="margin-top:6px"><span class="pot-badge pot-${pot}">${potLbl(pot)}</span></div>
        </div>
        <hr>
        <div style="margin-bottom:12px">
          <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px">Poznámka z review</div>
          <textarea rows="4" placeholder="Zápisky — pipeline, překážky, dohodnuté kroky..."
            onblur="saveNote('${p.n.replace(/'/g,"\\'")}',this.value)">${notes}</textarea>
          <div style="font-size:10px;color:var(--text3);margin-top:2px">Uloží se automaticky</div>
        </div>
        <hr>
        <div class="ctitle" style="margin-bottom:8px">Analýza</div>
        ${recos.map(r=>`<div class="reco ${r.t}"><div class="reco-title">${r.title}</div><p>${r.text}</p></div>`).join('')}
        ${p.poz?`<div class="reco rb"><div class="reco-title">Výchozí poznámka</div><p>${p.poz}</p></div>`:''}
      </div>

      <div class="card mt12">
        <div class="ctitle">Srovnání v týmu — ${p.vedouci}</div>
        ${teamCmp}
      </div>
    </div>
  </div>`;
}

// ── RECOS ──────────────────────────────────
function buildRecos(p) {
  const recos=[],tot=sodAll(p),akt=aktQ1(p),tier=kpTier(p),next=kpNext(p),pot=getPot(p),r=parseFloat(ratio(akt,WD_Q1));
  if(p.nastup.includes('2026')&&tot===0){recos.push({t:'rb',title:'Nováček v rozvoji',text:`Nastoupil ${p.nastup} — cíl: první SoD do konce Q2 2026.`});return recos;}
  if(tot>20e6) recos.push({t:'rg',title:'Výborný výkon',text:`SoD ${fms(tot)} — top výkon v divizi.`});
  else if(tot>5e6) recos.push({t:'rg',title:'Dobrý výkon',text:`SoD ${fms(tot)} — solidní start.`});
  else if(tot>0) recos.push({t:'ra',title:'Nízký objem SoD',text:`Pouze ${fms(tot)} — pod očekáváním. Zkontrolovat pipeline.`});
  else recos.push({t:'rr',title:'Žádný SoD v 2026',text:'Bez smlouvy v celém roce 2026. Nutná okamžitá analýza.'});
  if(p.pd>90&&tot>0) recos.push({t:'rr',title:'Kritická prodleva od posl. SoD',text:`${p.pd} dní bez nového SoD (od ${p.posl}). Co je v pipeline?`});
  else if(p.pd>45&&tot>0) recos.push({t:'ra',title:'Bez SoD přes měsíc',text:`Poslední SoD ${p.posl}. Tlačit na uzavření rozpracovaných akcí.`});
  if(akt===0&&!p.nastup.includes('2026')) recos.push({t:'rr',title:'Nulová aktivita Q1',text:'Žádné oměření ani jednání v Q1 — kritický signál.'});
  else if(r<0.5&&akt>0) recos.push({t:'ra',title:'Nízká intenzita',text:`${ratio(akt,WD_Q1)} jednání/pd — minimum je 0,5.`});
  else if(r>=1) recos.push({t:'rg',title:'Výborná intenzita',text:`${ratio(akt,WD_Q1)} jednání/pd — klíčové konvertovat na SoD.`});
  if(akt>50&&tot<5e6&&!p.nastup.includes('2026')) recos.push({t:'ra',title:'Aktivita nekoresponduje s výsledky',text:`${akt} úkonů v Q1, ale jen ${fms(tot)} SoD — analyzovat kvalitu.`});
  if(next&&p.kp>0) recos.push({t:'rb',title:'Cíl: další KP milník',text:`Chybí ${fms(next*1e6-p.kp)} do ${next} M Kč.`});
  return recos;
}

// ── EDIT PAGE ──────────────────────────────
function renderEdit() {
  const pg=document.getElementById('page-edit');
  const rows=PEOPLE.map((p,i)=>`<tr>
    <td class="L" style="white-space:nowrap">
      <div style="display:flex;align-items:center;gap:7px">${getPhoto(p.n,26)}<strong>${p.n}</strong></div>
    </td>
    <td class="L"><span class="bdg ${p.tym==='tech'?'bdg-t':'bdg-r'}">${p.vedouci.split(' ')[1]||p.vedouci}</span></td>
    <td><input type="number" id="sl${i}" value="${p.sod.l||0}" onchange="applyEdit()"></td>
    <td><input type="number" id="su${i}" value="${p.sod.u||0}" onchange="applyEdit()"></td>
    <td><input type="number" id="sb${i}" value="${p.sod.b||0}" onchange="applyEdit()"></td>
    <td><input type="number" id="sd${i}" value="${p.sod.d||0}" onchange="applyEdit()"></td>
    <td><input type="number" class="ro" value="${['l','u','b','d'].reduce((s,m)=>s+(p.om[m]||0),0)}" readonly></td>
    <td><input type="number" class="ro" value="${['l','u','b','d'].reduce((s,m)=>s+(p.vy[m]||0),0)}" readonly></td>
    <td><input type="number" class="ro" value="${['l','u','b','d'].reduce((s,m)=>s+(p.op[m]||0),0)}" readonly></td>
    <td><input type="number" class="ro" value="${['l','u','b','d'].reduce((s,m)=>s+(p.sc[m]||0),0)}" readonly></td>
    <td><input type="text" id="posl${i}" value="${p.posl}" style="min-width:110px" onchange="applyEdit()"></td>
    <td><input type="number" id="pd${i}" value="${p.pd}" onchange="applyEdit()"></td>
    <td><input type="number" id="kp${i}" value="${p.kp||0}" onchange="applyEdit()"></td>
    <td><select id="pot${i}" onchange="applyEdit()" style="font-size:11px;padding:3px 5px;border-radius:4px;border:1px solid var(--border2);width:auto">
      <option value="H" ${getPot(p)==='H'?'selected':''}>Vysoký</option>
      <option value="M" ${getPot(p)==='M'?'selected':''}>Střední</option>
      <option value="L" ${getPot(p)==='L'?'selected':''}>Nízký</option>
      <option value="N" ${getPot(p)==='N'?'selected':''}>Nováček</option>
    </select></td>
  </tr>`).join('');

  const planRows=PLANS.map((pl,i)=>`<tr>
    <td class="L"><span class="bdg ${pl.id==='rev'?'bdg-r':'bdg-t'}">${pl.label}</span></td>
    ${['l','u','b','d','k','c'].map(m=>`<td><input type="number" id="p${i}${m}" value="${pl.plan[m]}" onchange="applyPlan()"></td>`).join('')}
  </tr>`).join('');

  const noteRows=PEOPLE.map((p,i)=>`
    <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      ${getPhoto(p.n,28)}
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;margin-bottom:4px">${p.n} <span style="font-size:10px;font-weight:400;color:var(--text3)">${p.vedouci}</span></div>
        <textarea rows="2" placeholder="Zápisky z review..."
          id="note${i}" onblur="saveNote('${p.n.replace(/'/g,"\\'")}',this.value)">${getNotes(p)}</textarea>
      </div>
    </div>`).join('');

  pg.innerHTML=`
  <div class="shdr"><div>
    <div class="stitle">Editace dat</div>
    <div class="ssub">Změny se okamžitě promítají do všech záložek</div>
  </div>
  <button class="btn" onclick="exportNotes()">Exportovat poznámky</button>
  </div>

  <div class="card">
    <div class="ctitle">SoD a kariérní plán (hodnoty v Kč)</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px">Šedá = z KARAT (jen info). Bílá = editovatelná.</div>
    <div class="tw"><table>
      <thead><tr>
        <th class="L">Obchodník</th><th class="L">Tým</th>
        <th>SoD leden</th><th>SoD únor</th><th>SoD březen</th><th>SoD duben</th>
        <th>Oměření</th><th>P.výbor</th><th>Op.jedn.</th><th>V1 schůze</th>
        <th>Poslední SoD</th><th>Dny</th><th>KP objem</th><th>Potenciál</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>

  <div class="card mt16"><div class="ctitle">Měsíční plány (Kč)</div>
    <div class="tw mt8"><table>
      <thead><tr><th class="L">Tým</th>${MNAMES.map(m=>`<th>${m}</th>`).join('')}</tr></thead>
      <tbody>${planRows}</tbody>
    </table></div>
  </div>

  <div class="card mt16"><div class="ctitle">Poznámky z review</div>${noteRows}</div>`;
}

// ── SAVE HANDLERS ──────────────────────────
function applyEdit() {
  PEOPLE.forEach((p,i)=>{
    p.sod.l=parseInt(document.getElementById('sl'+i)?.value)||0;
    p.sod.u=parseInt(document.getElementById('su'+i)?.value)||0;
    p.sod.b=parseInt(document.getElementById('sb'+i)?.value)||0;
    p.sod.d=parseInt(document.getElementById('sd'+i)?.value)||0;
    p.posl=document.getElementById('posl'+i)?.value||p.posl;
    p.pd=parseInt(document.getElementById('pd'+i)?.value)||0;
    p.kp=parseInt(document.getElementById('kp'+i)?.value)||0;
    const s=document.getElementById('pot'+i); if(s) POT_OVR[p.n]=s.value;
  });
  buildSidebar();
}
function applyPlan() {
  PLANS.forEach((pl,i)=>{
    ['l','u','b','d','k','c'].forEach(m=>{
      pl.plan[m]=parseInt(document.getElementById('p'+i+m)?.value)||0;
    });
  });
}
function saveNote(name,val){NOTES[name]=val;}
function savePot(name,val){POT_OVR[name]=val;}
function exportNotes() {
  let txt='POZNAMKY Z REVIEW — RBD 2026\n'+'='.repeat(40)+'\n\n';
  PEOPLE.forEach(p=>{const n=getNotes(p);if(n)txt+=`${p.n}\n${p.vedouci}\n${n}\n\n`;});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download='review_poznamky_2026.txt'; a.click();
}

// ── INIT ───────────────────────────────────
buildSidebar();
renderOverview();
</script>
